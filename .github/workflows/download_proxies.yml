name: Update proxies

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Scrape proxies
      run: |
        go run http.go
        go run socks.go

    - name: Check the scrapers produced something
      run: |
        for f in http.txt socks.txt; do
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty, refusing to publish"
            exit 1
          fi
        done

    - name: Publish to the proxies branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p out
        mv http.txt socks.txt out/
        cd out
        git init -q -b proxies
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add http.txt socks.txt
        git commit -q -m "update proxies"
        git push -q --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" proxies
